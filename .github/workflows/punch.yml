name: 我在校园打卡

on:
  workflow_dispatch:
  schedule:
    # 北京时间 21:30 (UTC 13:30)
    - cron: '30 13 * * *'
    # 北京时间 22:30 (UTC 14:30)
    - cron: '30 14 * * *'
    # 北京时间 23:30 (UTC 15:30)
    - cron: '30 15 * * *'

jobs:
  User01:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: 3.9
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install PyYAML
    - name: 执行打卡
      # 注意：这里我们改为执行你修改过的 WoZaiXiaoYuan.py，这样它就会读取你配置好的 config.yaml
      run: python WoZaiXiaoYuan.py
